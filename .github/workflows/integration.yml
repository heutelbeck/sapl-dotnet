name: Integration tests (SAPL Node)

# The Sapl.IntegrationTests suite drives the PDP client against a real SAPL
# Node started via Testcontainers. It needs the sapl-node image locally; the
# image is the published release pulled from ghcr.io.

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.gitignore'
      - '**.md'
  workflow_dispatch:

concurrency:
  group: integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sapl-node-integration:
    runs-on: ubuntu-latest
    steps:
      - name: Check out sapl-dotnet
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Pull SAPL Node image
        run: docker pull ghcr.io/heutelbeck/sapl-node:4.1.2

      - name: Setup .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: 9.0.x

      - name: Run integration tests
        run: dotnet test Sapl.IntegrationTests/Sapl.IntegrationTests.csproj --verbosity normal
