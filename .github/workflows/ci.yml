name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: 9.0.x

      - name: Restore
        run: dotnet restore Sapl.sln

      - name: Build
        run: dotnet build Sapl.sln --no-restore

      # The Sapl.IntegrationTests suite needs a real SAPL Node container and
      # runs in integration.yml; exclude it here so the unit build stays fast
      # and independent of the engine image.
      - name: Test
        run: dotnet test Sapl.sln --no-build --verbosity normal --filter "FullyQualifiedName!~Sapl.IntegrationTests"

      - name: Format check
        run: dotnet format Sapl.sln --verify-no-changes
