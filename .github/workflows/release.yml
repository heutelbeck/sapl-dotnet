name: Release to NuGet

on:
  push:
    tags: ["v*"]

jobs:
  release:
    runs-on: ubuntu-latest
    environment: release
    timeout-minutes: 15
    permissions:
      id-token: write
      contents: write

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: 9.0.x

      - name: Restore
        run: dotnet restore Sapl.sln

      - name: Build
        run: dotnet build Sapl.sln -c Release --no-restore

      - name: Test (unit only; integration tests run in their own workflow)
        run: dotnet test Sapl.sln -c Release --no-build --verbosity normal --filter "FullyQualifiedName!~Sapl.IntegrationTests"

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Pack
        run: |
          dotnet pack Sapl.Core/Sapl.Core.csproj -c Release --no-build -p:PackageVersion=${{ steps.version.outputs.VERSION }} -o packages
          dotnet pack Sapl.Rsocket/Sapl.Rsocket.csproj -c Release --no-build -p:PackageVersion=${{ steps.version.outputs.VERSION }} -o packages
          dotnet pack Sapl.EntityFrameworkCore/Sapl.EntityFrameworkCore.csproj -c Release --no-build -p:PackageVersion=${{ steps.version.outputs.VERSION }} -o packages
          dotnet pack Sapl.AspNetCore/Sapl.AspNetCore.csproj -c Release --no-build -p:PackageVersion=${{ steps.version.outputs.VERSION }} -o packages

      - name: NuGet login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push to NuGet
        run: dotnet nuget push "packages/*.nupkg" --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate

      - name: Delete tag on failure
        if: failure()
        run: git push --delete origin "$GITHUB_REF_NAME"
