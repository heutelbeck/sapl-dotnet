name: Release to NuGet

on:
  push:
    tags: ["v*"]

jobs:
  release:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup .NET
        uses: actions/setup-dotnet@9a946fdbd5fb07b82b2f5a4466058b876ab72bb2 # v5.3.0
        with:
          dotnet-version: 9.0.x

      - name: Restore
        run: dotnet restore Sapl.sln

      - name: Build
        run: dotnet build Sapl.sln -c Release --no-restore

      - name: Test
        run: dotnet test Sapl.sln -c Release --no-build --verbosity normal

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Pack
        run: |
          dotnet pack Sapl.Core/Sapl.Core.csproj -c Release --no-build -p:PackageVersion=${{ steps.version.outputs.VERSION }} -o packages
          dotnet pack Sapl.AspNetCore/Sapl.AspNetCore.csproj -c Release --no-build -p:PackageVersion=${{ steps.version.outputs.VERSION }} -o packages

      - name: NuGet login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push to NuGet
        run: dotnet nuget push "packages/*.nupkg" --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate

      - name: Delete tag on failure
        if: failure()
        run: git push --delete origin "$GITHUB_REF_NAME"
